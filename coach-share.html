    <script>
      (function () {
        var form = document.getElementById('coach-gate-form');
        var portal = document.getElementById('coach-portal');
        var err = document.getElementById('coach-gate-err');
        var pass = document.getElementById('coach-pass');
        var enter = document.getElementById('coach-enter-course');

        function showPortal() {
          form.classList.add('is-hidden');
          portal.classList.add('is-open');
          var params = new URLSearchParams(location.search);
          var next = params.get('next');
          if (next && /^\/Learn\//i.test(next)) {
            enter.href = next;
          }
        }

        function showForm() {
          form.classList.remove('is-hidden');
          portal.classList.remove('is-open');
        }

        if (window.CoachGate && CoachGate.isUnlocked()) {
          showPortal();
        } else {
          showForm();
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          CoachGate.verifyPasscode(pass.value).then(function (ok) {
            if (!ok) {
              err.textContent = '登入碼不正確，請再試。';
              pass.select();
              return;
            }
            CoachGate.setUnlocked(true);
            showPortal();
            pass.value = '';
          }).catch(function (ex) {
            err.textContent = ex.message || '無法驗證，請稍後再試。';
          });
        });

        document.getElementById('coach-logout').addEventListener('click', function () {
          CoachGate.logout();
        });
      })();
    </script>
