name: Weekly featured article (MiniMax)

on:
  schedule:
    # 每週一約香港時間 11:00（UTC 03:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-main
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
      MINIMAX_API_BASE: ${{ secrets.MINIMAX_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify MiniMax secret
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::warning::MINIMAX_API_KEY 未設定，將略過產文。"
          else
            echo "MINIMAX_API_KEY 已設定。"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: |
          cd automation
          npm ci

      - name: Generate weekly article
        run: |
          cd automation
          node weekly-article.mjs

      - name: Apply SEO and sitemap
        run: node automation/apply-seo.mjs

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No weekly changes; skip push."
            exit 0
          fi
          git commit -m "chore(content): weekly featured article [automated]"
          git push origin HEAD:main
