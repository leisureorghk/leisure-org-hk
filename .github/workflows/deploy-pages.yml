# 將倉庫靜態檔案部署到 GitHub Pages（需在倉庫 Settings → Pages 選擇 GitHub Actions）
# 排除 tools/、docs/ 與本機雜訊，避免非公開檔掛上公開站
name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  # GITHUB_TOKEN 自動 push 不會觸發 push 事件；改由 digest／週報完成後連動部署
  workflow_run:
    workflows:
      - Daily RSS digest
      - Weekly featured article (MiniMax)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # 過渡期：強制以 Node 24 執行仍依賴舊 runtime 的 JavaScript action（見 GitHub Blog 2025-09-19）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build clean Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='tools' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='automation/node_modules' \
            --exclude='.cursor' \
            --exclude='agent-transcripts' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='indexnow_key' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='README.md' \
            ./ _site/
          # 確認公開關鍵檔存在
          test -f _site/index.html
          test -f _site/sitemap.xml
          test ! -d _site/tools
          test ! -d _site/docs
          echo "Pages artifact ready: $(find _site -type f | wc -l) files"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
