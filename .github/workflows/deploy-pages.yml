# 將倉庫靜態檔案部署到 GitHub Pages
# 排除 tools/docs/Learn/private 與本機雜訊；深入教材不進公開站
name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  workflow_run:
    workflows:
      - Daily RSS digest
      - Weekly featured article (MiniMax)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build clean Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='tools' \
            --exclude='docs' \
            --exclude='private' \
            --exclude='functions' \
            --exclude='Learn' \
            --exclude='data/coach-content' \
            --exclude='data/allowlist.example.json' \
            --exclude='firestore.rules' \
            --exclude='storage.rules' \
            --exclude='firebase.json' \
            --exclude='node_modules' \
            --exclude='automation/node_modules' \
            --exclude='.cursor' \
            --exclude='agent-transcripts' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='indexnow_key' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='README.md' \
            ./ _site/
          # Learn 只留轉址入口
          mkdir -p _site/Learn
          node automation/write-coach-redirect-stubs.mjs --out _site
          test -f _site/index.html
          test -f _site/sitemap.xml
          test ! -d _site/private
          test ! -d _site/tools
          # 確認深入頁為轉址殼而非全文
          if grep -q 'TEACCH／STEP' _site/sen-swim-classroom.html 2>/dev/null; then
            echo "ERROR: deep classroom content leaked into Pages" >&2
            exit 1
          fi
          grep -q '教練會員區' _site/sen-swim-classroom.html
          echo "Pages artifact ready: $(find _site -type f | wc -l) files"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
