name: Daily RSS digest

on:
  schedule:
    # 約香港時間每日 09:00（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest-main
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL || 'MiniMax-M3' }}
      MINIMAX_API_BASE: ${{ secrets.MINIMAX_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Verify MiniMax secret (摘要繁中翻譯)
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::warning::MINIMAX_API_KEY 未設定，摘要將維持 RSS 原文語言。請於 Settings → Secrets → Actions 新增。"
          else
            echo "MINIMAX_API_KEY 已設定，將嘗試譯為繁中。"
          fi

      - name: Build digest JSON
        run: |
          cd automation
          npm ci
          node build-digest.mjs

      - name: Commit and push to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sen-swim-digest.json; then
            echo "Digest unchanged; skip push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/sen-swim-digest.json
          git commit -m "chore(data): update SEN/swim RSS digest [automated]"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: digest
    if: >-
      needs.digest.result == 'success' &&
      (needs.digest.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
