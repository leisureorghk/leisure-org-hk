name: Daily RSS digest

on:
  schedule:
    # 約香港時間每日 09:00（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Build digest JSON
        run: |
          cd automation
          npm ci
          node build-digest.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(data): update SEN/swim RSS digest'
          title: 'Automated: daily RSS digest update'
          body: |
            此 PR 由 GitHub Actions 自動建立，更新 `data/sen-swim-digest.json`。

            - 合併前可快速檢查 JSON 與來源是否合理。
            - 合併後 GitHub Pages（或您的靜態主機）重新部署即可在「教練專欄」看到摘要。
          branch: automated/digest-update
          delete-branch: true
          add-paths: |
            data/sen-swim-digest.json
