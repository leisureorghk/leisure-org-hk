<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <title>Coach peer circle</title>
  <style>
    .ring{transform-origin:360px 120px;animation:spinSlow 18s linear infinite}
    .node{animation:pulse 3.2s ease-in-out infinite}
    @keyframes spinSlow{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.ring,.node{animation:none}}
  </style>
  <rect width="720" height="240" rx="20" fill="#0D2847"/>
  <circle cx="360" cy="120" r="78" fill="none" stroke="#2A9D8F" stroke-width="2" opacity=".35"/>
  <g class="ring">
    <circle cx="360" cy="42" r="14" fill="#F7C948"/>
    <circle cx="438" cy="78" r="12" fill="#A8D4F0"/>
    <circle cx="438" cy="162" r="12" fill="#2A9D8F"/>
    <circle cx="360" cy="198" r="14" fill="#E9C46A"/>
    <circle cx="282" cy="162" r="12" fill="#A8D4F0"/>
    <circle cx="282" cy="78" r="12" fill="#2A9D8F"/>
  </g>
  <circle class="node" cx="360" cy="120" r="26" fill="#1E5799" stroke="#A8D4F0" stroke-width="3"/>
  <text x="360" y="126" text-anchor="middle" fill="#fff" font-family="Noto Sans TC,sans-serif" font-size="13" font-weight="700">Coach</text>
</svg>
