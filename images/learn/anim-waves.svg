<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img">
  <title>Gentle pool waves</title>
  <style>
    .w1{fill:#5BA3D9;opacity:.45}
    .w2{fill:#2A9D8F;opacity:.35}
    .w3{fill:#1E5799;opacity:.22}
    .w1,.w2,.w3{animation:drift 7s ease-in-out infinite}
    .w2{animation-duration:9s;animation-direction:reverse}
    .w3{animation-duration:11s}
    @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}
    @media (prefers-reduced-motion:reduce){.w1,.w2,.w3{animation:none}}
  </style>
  <rect width="720" height="120" fill="#E8F4FB"/>
  <path class="w3" d="M0 70 Q90 40 180 70 T360 70 T540 70 T720 70 V120 H0Z"/>
  <path class="w2" d="M0 82 Q90 58 180 82 T360 82 T540 82 T720 82 V120 H0Z"/>
  <path class="w1" d="M0 94 Q90 78 180 94 T360 94 T540 94 T720 94 V120 H0Z"/>
</svg>
