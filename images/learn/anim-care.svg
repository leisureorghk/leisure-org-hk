<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <title>Caring conversation bubbles</title>
  <style>
    .b1{animation:bob 4s ease-in-out infinite}
    .b2{animation:bob 4.8s ease-in-out infinite .6s}
    .dot{animation:blink 2.4s ease-in-out infinite}
    .wave{animation:wave 8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
    @media (prefers-reduced-motion:reduce){.b1,.b2,.dot,.wave{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F4FB"/>
      <stop offset="100%" stop-color="#F5F0E6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="240" rx="20" fill="url(#bg)"/>
  <path class="wave" d="M0 190 Q120 170 240 190 T480 190 T720 190 V240 H0 Z" fill="#2A9D8F" opacity=".18"/>
  <g class="b1">
    <rect x="120" y="70" width="200" height="90" rx="22" fill="#fff" stroke="#1E5799" stroke-width="2"/>
    <polygon points="160,160 180,160 155,185" fill="#fff" stroke="#1E5799" stroke-width="2"/>
    <circle class="dot" cx="175" cy="115" r="7" fill="#1E5799"/>
    <circle class="dot" cx="205" cy="115" r="7" fill="#2A9D8F" style="animation-delay:.3s"/>
    <circle class="dot" cx="235" cy="115" r="7" fill="#F7C948" style="animation-delay:.6s"/>
  </g>
  <g class="b2">
    <rect x="400" y="55" width="220" height="100" rx="24" fill="#1E5799"/>
    <polygon points="560,155 540,155 580,185" fill="#1E5799"/>
    <circle cx="455" cy="95" r="14" fill="#F4A261"/>
    <circle cx="510" cy="92" r="12" fill="#E9C46A"/>
    <rect x="470" y="118" width="90" height="10" rx="5" fill="#A8D4F0" opacity=".85"/>
  </g>
</svg>
