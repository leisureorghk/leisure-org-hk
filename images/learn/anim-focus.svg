<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img">
  <title>Short focus units lighting up</title>
  <style>
    .u{fill:#FFFCF5;stroke:#1E5799;stroke-width:3}
    .g{fill:#E9C46A;opacity:0}
    .g1{animation:on 6s ease-in-out infinite}
    .g2{animation:on 6s ease-in-out 2s infinite}
    .g3{animation:on 6s ease-in-out 4s infinite}
    @keyframes on{0%,22%,100%{opacity:0}8%,16%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.g{animation:none;opacity:.5}}
  </style>
  <rect width="640" height="280" fill="#F5ECD7"/>
  <rect class="u" x="70" y="70" width="140" height="140" rx="18"/>
  <rect class="g g1" x="70" y="70" width="140" height="140" rx="18"/>
  <rect class="u" x="250" y="70" width="140" height="140" rx="18"/>
  <rect class="g g2" x="250" y="70" width="140" height="140" rx="18"/>
  <rect class="u" x="430" y="70" width="140" height="140" rx="18"/>
  <rect class="g g3" x="430" y="70" width="140" height="140" rx="18"/>
  <circle cx="140" cy="140" r="18" fill="#5BA3D9"/>
  <circle cx="320" cy="140" r="18" fill="#2A9D8F"/>
  <circle cx="500" cy="140" r="18" fill="#1E5799"/>
</svg>
