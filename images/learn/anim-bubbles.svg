<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <title>Rising bubbles</title>
  <style>
    .b{fill:rgba(255,255,255,.7);stroke:#A8D4F0;stroke-width:2;animation:up 4s ease-in infinite}
    @keyframes up{0%{transform:translateY(40px);opacity:0}20%{opacity:.9}100%{transform:translateY(-160px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.b{animation:none;opacity:.6}}
  </style>
  <rect width="720" height="240" rx="20" fill="#1E5799"/>
  <rect y="170" width="720" height="70" fill="#163A5F"/>
  <ellipse cx="360" cy="176" rx="220" ry="14" fill="#2A9D8F" opacity=".5"/>
  <circle class="b" cx="240" cy="180" r="10"/>
  <circle class="b" cx="300" cy="190" r="7" style="animation-delay:.6s"/>
  <circle class="b" cx="360" cy="185" r="12" style="animation-delay:1.1s"/>
  <circle class="b" cx="420" cy="192" r="8" style="animation-delay:1.8s"/>
  <circle class="b" cx="480" cy="188" r="11" style="animation-delay:2.4s"/>
</svg>
