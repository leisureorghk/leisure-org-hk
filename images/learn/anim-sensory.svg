<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img">
  <title>Sensory wrap motion</title>
  <style>
    .r{transform-origin:320px 130px;fill:none;stroke:#2A9D8F;stroke-width:8;opacity:.35;animation:p 4s ease-in-out infinite}
    .r2{stroke:#5BA3D9;animation-delay:.7s}
    .r3{stroke:#E9C46A;animation-delay:1.4s}
    @keyframes p{0%,100%{transform:scale(.7);opacity:.15}50%{transform:scale(1.15);opacity:.55}}
    @media (prefers-reduced-motion:reduce){.r{animation:none;opacity:.4}}
  </style>
  <rect width="640" height="280" fill="#FFFCF5"/>
  <ellipse cx="320" cy="210" rx="180" ry="22" fill="#A8D4F0"/>
  <circle class="r" cx="320" cy="130" r="70"/>
  <circle class="r r2" cx="320" cy="130" r="70"/>
  <circle class="r r3" cx="320" cy="130" r="70"/>
  <circle cx="320" cy="130" r="26" fill="#F5ECD7"/>
  <rect x="302" y="156" width="36" height="40" rx="12" fill="#1E5799"/>
</svg>
