<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380">
  <rect width="960" height="380" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#155e75">STEP 適應：調空間、任務、設備、人員</text>
  <g font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700">
    <rect x="30" y="70" width="210" height="210" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3">
      <animate attributeName="stroke-width" values="3;8;3" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="130" text-anchor="middle">S Space</text>
    <text x="135" y="170" text-anchor="middle" font-weight="400" font-size="15">淺水／面向教練</text>
    <text x="135" y="200" text-anchor="middle" font-weight="400" font-size="15">遠離跳台</text>
    <rect x="260" y="70" width="210" height="210" rx="16" fill="#fef9c3" stroke="#b45309" stroke-width="3">
      <animate attributeName="stroke-width" values="3;8;3" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="365" y="130" text-anchor="middle">T Task</text>
    <text x="365" y="170" text-anchor="middle" font-weight="400" font-size="15">縮短距離／下數</text>
    <text x="365" y="200" text-anchor="middle" font-weight="400" font-size="15">改為到邊自救</text>
    <rect x="490" y="70" width="210" height="210" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3">
      <animate attributeName="stroke-width" values="3;8;3" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="595" y="130" text-anchor="middle">E Equipment</text>
    <text x="595" y="170" text-anchor="middle" font-weight="400" font-size="15">浮條／圖卡／閃燈</text>
    <text x="595" y="200" text-anchor="middle" font-weight="400" font-size="15">修改設備 MEq</text>
    <rect x="720" y="70" width="210" height="210" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3">
      <animate attributeName="stroke-width" values="3;8;3" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="825" y="130" text-anchor="middle">P People</text>
    <text x="825" y="170" text-anchor="middle" font-weight="400" font-size="15">1:1／1:3／助教</text>
    <text x="825" y="200" text-anchor="middle" font-weight="400" font-size="15">修改人員比例</text>
  </g>
  <text x="30" y="330" font-size="16" font-family="Microsoft JhengHei">4.4：適應／改良方法包括教學、規則、設備、環境；STEP 把調整寫進教案並解釋原因。</text>
</svg>