<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300">
  <rect width="960" height="300" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#155e75">4.3 師生比例（參考）隨需要收緊</text>
  <g font-family="Microsoft JhengHei, sans-serif">
    <text x="80" y="90" font-size="18">嚴重智障 1:1</text>
    <rect x="80" y="110" width="40" height="40" fill="#0e7490"/>
    <circle cx="160" cy="130" r="18" fill="#fde68a" stroke="#111">
      <animate attributeName="r" values="18;22;18" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="90" font-size="18">中度智障 1:5　自閉症 1:3</text>
    <rect x="300" y="110" width="40" height="40" fill="#0e7490"/>
    <circle cx="380" cy="130" r="16" fill="#fde68a" stroke="#111"/>
    <circle cx="420" cy="130" r="16" fill="#fde68a" stroke="#111"/>
    <circle cx="460" cy="130" r="16" fill="#fde68a" stroke="#111"/>
    <text x="80" y="210" font-size="18">輕度智障 1:10　教學強度視病歷、體適能</text>
    <text x="80" y="250" font-size="15" fill="#334155">安全鏈：更衣室開始，至交回家人。唐氏心肺耐力／肌耐力不足；部分自閉症柔軟度不足。</text>
  </g>
</svg>