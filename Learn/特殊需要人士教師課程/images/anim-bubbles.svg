<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340">
  <rect width="960" height="340" fill="#e0f2fe"/>
  <text x="28" y="36" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#155e75">整體－部分－整體：口吸、水中吐氣吹泡</text>
  <rect x="40" y="180" width="880" height="90" fill="#38bdf8"/>
  <circle cx="200" cy="220" r="18" fill="#fff" stroke="#0369a1" stroke-width="3">
    <animate attributeName="cy" values="220;90;220" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="210" r="12" fill="#fff" stroke="#0369a1" stroke-width="3">
    <animate attributeName="cy" values="210;70;210" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="230" r="22" fill="#fff" stroke="#0369a1" stroke-width="3">
    <animate attributeName="cy" values="230;80;230" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="520" y="120" font-size="18" font-family="Microsoft JhengHei">部分：只練呼吸　→　整體：再加踢水</text>
  <text x="40" y="310" font-size="16" font-family="Microsoft JhengHei">4.4 教學：清晰簡明、示範、整體-部分-整體；初期用口吸氣減少嗆水恐懼。</text>
</svg>